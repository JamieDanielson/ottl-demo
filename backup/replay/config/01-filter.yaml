# GENERATED by backup/replay/make_replay.py. Do not edit.
# Stage 1: drop health-check noise with the filter processor.
receivers:
  otlp_json_file:
    include: [/data/*.ndjson]
    start_at: beginning      # offsets live in memory: restart the container to replay
    include_file_name: false

processors:
  filter/health:
    error_mode: ignore
    trace_conditions:          # a span is dropped when ANY condition is true
      - 'IsMatch(span.attributes["url.path"], "^/(healthz?|readyz|livez)$$")'
      - 'IsMatch(span.attributes["user_agent.original"], "^kube-probe/")'

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp_json_file]
      processors: [filter/health]
      exporters: [debug]
