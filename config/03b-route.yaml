# Stage 3b: route AI spans to the AI team's backend as well, and send everything
# else, whole traces minus the bulky prompt bodies, to Jaeger.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/health:
    error_mode: ignore
    trace_conditions:
      - 'IsMatch(span.attributes["url.path"], "^/(healthz?|readyz|livez)$$")'
      - 'IsMatch(span.attributes["user_agent.original"], "^kube-probe/")'

  transform/normalize:
    error_mode: ignore
    trace_statements:
      # No path in this statement, so the context can't be inferred: name it.
      - context: span
        statements:
          - 'set_semconv_span_name("1.43.0")'

  transform/redact:
    error_mode: ignore
    trace_statements:
      # One group per context: a group runs in the most specific context its paths
      # need, so a spanevent path in a span group would skip spans with no events.
      - statements:
          # Secrets: match on the KEY name (anchored, so gen_ai.usage.input_tokens survives).
          - 'delete_matching_keys(span.attributes, "(?i).*(authorization|cookie|token|password|secret)$$")'
          # Pseudonymize the user so they stay joinable: hash, then delete.
          - 'set(span.attributes["user.hash"], SHA256(span.attributes["user.email"])) where span.attributes["user.email"] != nil'
          - 'delete_key(span.attributes, "user.email")'
          # PII inside any string attribute VALUE, whatever the key is called.
          - 'replace_all_patterns(span.attributes, "value", "\\b(?:\\d[ -]?){12}(\\d{4})\\b", "**** **** **** $$1")'
          - 'replace_all_patterns(span.attributes, "value", "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "<email>")'
          # Keep query parameter names, drop their values.
          - 'replace_pattern(span.attributes["url.query"], "=[^&]*", "=REDACTED")'
      - statements:
          - 'replace_all_patterns(spanevent.attributes, "value", "\\b(?:\\d[ -]?){12}(\\d{4})\\b", "**** **** **** $$1")'
          - 'replace_all_patterns(spanevent.attributes, "value", "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "<email>")'

  transform/strip-prompts:
    error_mode: ignore
    trace_statements:
      # Prompts and responses are big and only the AI team needs them.
      - 'delete_matching_keys(span.attributes, "^gen_ai\\.(input|output)\\.messages$$")'

connectors:
  routing:
    error_mode: ignore
    default_pipelines: [traces/default]
    table:
      - condition: span.attributes["gen_ai.operation.name"] != nil
        action: copy              # AI spans ALSO stay in the default route, so traces stay whole
        pipelines: [traces/ai]

exporters:
  debug/my-ai-backend:            # stand-in for the AI team's LLM observability backend
    verbosity: detailed
  debug/default:
    verbosity: basic
  otlp_grpc/jaeger:               # any OTLP backend works here
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [filter/health, transform/normalize, transform/redact]
      exporters: [routing]
    traces/ai:
      receivers: [routing]
      exporters: [debug/my-ai-backend]
    traces/default:
      receivers: [routing]
      processors: [transform/strip-prompts]
      exporters: [debug/default, otlp_grpc/jaeger]
