# Stage 2a: normalize span names, then a FIRST TRY at redaction.
# Deliberately flawed: one flat list mixes span and spanevent paths, so the whole
# list is inferred as the spanevent context and runs once per span EVENT. Spans
# with no events (the checkout span with the email and token) are never touched.
# Stage 2b is the fix.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/health:
    error_mode: ignore
    trace_conditions:
      - 'IsMatch(span.attributes["url.path"], "^/(healthz?|readyz|livez)$$")'
      - 'IsMatch(span.attributes["user_agent.original"], "^kube-probe/")'

  transform/normalize:
    error_mode: ignore
    trace_statements:
      # No path in this statement, so the context can't be inferred: name it.
      - context: span
        statements:
          - 'set_semconv_span_name("1.43.0")'

  transform/redact:
    error_mode: ignore
    trace_statements:
      # Secrets: match on the KEY name (anchored, so gen_ai.usage.input_tokens survives).
      - 'delete_matching_keys(span.attributes, "(?i).*(authorization|cookie|token|password|secret)$$")'
      # Keep the user joinable without keeping the address: hash, then delete.
      - 'set(span.attributes["user.hash"], SHA256(span.attributes["user.email"])) where span.attributes["user.email"] != nil'
      - 'delete_key(span.attributes, "user.email")'
      # PII inside any string VALUE, whatever the key is called.
      - 'replace_all_patterns(span.attributes, "value", "\\b(?:\\d[ -]?){12}(\\d{4})\\b", "**** **** **** $$1")'
      - 'replace_all_patterns(span.attributes, "value", "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "<email>")'
      # Keep query parameter names, drop their values.
      - 'replace_pattern(span.attributes["url.query"], "=[^&]*", "=REDACTED")'
      # Span events too.
      - 'replace_all_patterns(spanevent.attributes, "value", "\\b(?:\\d[ -]?){12}(\\d{4})\\b", "**** **** **** $$1")'
      - 'replace_all_patterns(spanevent.attributes, "value", "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "<email>")'

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/health, transform/normalize, transform/redact]
      exporters: [debug]
