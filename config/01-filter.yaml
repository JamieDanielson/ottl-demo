# Stage 1: drop health-check noise with the filter processor.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/health:
    error_mode: ignore
    trace_conditions:          # a span is dropped when ANY condition is true
      - 'IsMatch(span.attributes["url.path"], "^/(healthz?|readyz|livez)$$")'
      - 'IsMatch(span.attributes["user_agent.original"], "^kube-probe/")'

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/health]
      exporters: [debug]
